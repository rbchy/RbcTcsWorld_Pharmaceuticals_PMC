# Runs on 8081 so it doesn't clash with ClinTrial-Connect (which uses 8080)
server.port=8081
spring.application.name=RbcTcsWorld_PharmaBatchLotCalc

# Pretty-print JSON responses (nice for testing in a browser/Postman)
spring.jackson.serialization.indent-output=true

# --- Database: a NEW, independent schema for this calculator (not the
#     pharma-packaging-system's 9-table schema). Same env-var pattern as
#     ClinTrial-Connect so you can export once per terminal session:
#       export DB_HOST=localhost DB_PORT=3306 DB_NAME=batch_lot_calc \
#              DB_USER=batchcalc_app DB_PASSWORD='yourpassword'
#     Create the database first:  CREATE DATABASE batch_lot_calc;
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:batch_lot_calc}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-create/update tables from the @Entity classes. Good for dev; for
# production use a migration tool (Flyway/Liquibase) instead and set this
# to "validate" or "none".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Swagger / OpenAPI ---
# Interactive docs: http://localhost:8081/swagger-ui.html
# Raw OpenAPI JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
