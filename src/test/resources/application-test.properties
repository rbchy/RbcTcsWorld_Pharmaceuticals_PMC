# Used ONLY when tests run with @ActiveProfiles("test") — an in-memory H2
# database so `mvn test` never needs a live MySQL server. Tables are created
# fresh and dropped after each test run (create-drop).
spring.datasource.url=jdbc:h2:mem:batchlotcalc;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
